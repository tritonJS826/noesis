name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: macos

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev

      - name: Check C compiler
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            gcc --version
          else
            cc --version
          fi

      - name: Build release binaries
        shell: bash
        env:
          MODEL: gemma4:31b-cloud
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          bash ./CICD/build-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.platform }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noesis-${{ matrix.platform }}-${{ matrix.goarch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  # Build a Vulkan-enabled whisper.cpp runtime and publish it as a release
  # asset. The app downloads these archives into its cache as "runtime-vulkan"
  # when the user selects the Vulkan backend (see internal/core/whisper.go).
  whisper-vulkan:
    name: Whisper Vulkan runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: noesis-whisper-vulkan-linux-amd64.tar.gz
            archive_kind: tar
          - os: windows-latest
            platform: windows
            asset: noesis-whisper-vulkan-windows-amd64.zip
            archive_kind: zip

    steps:
      - name: Check out whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: b5454
          path: whisper.cpp

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure (Linux)
        if: matrix.archive_kind == 'tar'
        shell: bash
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: matrix.archive_kind == 'zip'
        shell: bash
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON

      - name: Build
        shell: bash
        working-directory: whisper.cpp
        run: cmake --build build --config Release --target whisper-cli

      - name: Stage runtime (Linux)
        if: matrix.archive_kind == 'tar'
        shell: bash
        working-directory: whisper.cpp
        run: |
          set -euo pipefail
          stage="stage/noesis-whisper-vulkan"
          mkdir -p "$stage"
          # Every CMake target (the CLI and all shared libraries) is written to
          # build/bin. Copy it wholesale so .so symlinks such as libggml.so.0
          # (needed by the dynamic loader) are preserved. LD_LIBRARY_PATH is set
          # to this directory at run time.
          cp -a build/bin/. "$stage/"
          test -f "$stage/whisper-cli"
          ls -l "$stage"
          tar -C stage -czf "$asset" noesis-whisper-vulkan
          ls -l "$asset"
        env:
          asset: ${{ matrix.asset }}

      - name: Stage runtime (Windows)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          $stage = "stage/noesis-whisper-vulkan"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "build/bin/Release/*" -Destination $stage -Recurse -Force
          if (-not (Test-Path "$stage/whisper-cli.exe")) { throw "whisper-cli.exe missing" }
          Get-ChildItem $stage
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.asset }}" -Force
          Get-ChildItem "${{ matrix.asset }}"

      - name: Upload Vulkan runtime
        uses: actions/upload-artifact@v4
        with:
          name: noesis-whisper-vulkan-${{ matrix.platform }}-amd64
          path: whisper.cpp/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, whisper-vulkan]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: noesis ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
